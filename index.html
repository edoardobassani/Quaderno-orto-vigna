<style>

:root{

  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ink:#E7ECE3; --ink-2:#A9B5AA; --accent:#7CC08B; --accent-ink:#0F1A12;
  --serra:#8EC3DA; --serra-fill:#21404D; --campo-fill:#2C4527; --tunnel-fill:#352F4D; --tunnel:#B9AEE6; --vigna-fill:#45283A; --vigna:#E3A1C0;
  --soil:#5E4630; --soil-2:#76593D; --warn:#F2B35C; --warn-bg:#3D2C12; --bad:#F2918A; --bad-bg:#45201D; --ok-bg:#24381F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141A15; --surface:#1E2620; --surface-2:#252E27; --line:#36423A;
  --ink:#E7ECE3; --ink-2:#A9B5AA; --accent:#7CC08B; --accent-ink:#0F1A12;
  --serra:#8EC3DA; --serra-fill:#21404D; --campo-fill:#2C4527; --tunnel-fill:#352F4D; --tunnel:#B9AEE6; --vigna-fill:#45283A; --vigna:#E3A1C0;

.nav div{display:flex;max-width:560px;width:100%;justify-content:space-around}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:none;background:transparent;color:var(--ink-2);font:600 14px var(--f-body);border-radius:9px;white-space:nowrap;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tablebox{overflow-x:auto}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:13px;color:var(--ink-2)}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.nav a{position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-2);text-decoration:none;min-width:48px;min-height:44px;border-radius:12px}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-bg,rgba(46,107,62,.12))}
.nav svg{width:26px;height:26px}

.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar span.w{background:var(--warn)} .bar span.x{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}

a{color:var(--serra)}
.src{font-size:13px}

function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((a-b)/864e5)}
var GG=["dom","lun","mar","mer","gio","ven","sab"],MM=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function fmt(d){return GG[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()]}
function fmtRel(d){var n=diffDays(d,today());if(n===0)return "oggi";if(n===1)return "domani";if(n===-1)return "ieri";return fmt(d)}
function area(p){var a=0;for(var i=0;i<p.length;i++){var j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1]}return Math.abs(a)/2}
function pip(pt,p){var x=pt[0],y=pt[1],ins=false;for(var i=0,j=p.length-1;i<p.length;j=i++){var xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function dSeg(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));var x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return Math.sqrt(x*x+y*y)}

function spacing(c){return CROPS[c].row/100}
function hashOf(plants){var h={};plants.forEach(function(p,i){var k=Math.floor(p.x)+":"+Math.floor(p.y);(h[k]=h[k]||[]).push(i)});return h}
function near(h,plants,x,y,r,fn){var cx=Math.floor(x),cy=Math.floor(y),R=Math.ceil(r);for(var i=cx-R;i<=cx+R;i++)for(var j=cy-R;j<=cy+R;j++){var b=h[i+":"+j];if(b)b.forEach(function(k){fn(plants[k],k)})}}
function needed(a,b){return (spacing(a)+spacing(b))/2}
function conflicts(plot){
  var P=plot.plants,h=hashOf(P),bad=new Set(),minD={};
  P.forEach(function(p,i){near(h,P,p.x,p.y,1,function(q,k){if(k<=i)return;var d=Math.hypot(p.x-q.x,p.y-q.y),n=needed(p.c,q.c)*0.9;if(d<n){bad.add(i);bad.add(k);minD[i]=d;minD[k]=d}})});
  return {bad:bad,minD:minD};
}
function fill(plot,c,limit){
  var cr=CROPS[c],r=cr.row/100,b2=cr.btw/100,poly=plot.pts,lim=limit||poly,bb=bbox(lim),added=0;
  var h=hashOf(plot.plants);
  for(var y=bb.y0+b2/2;y<=bb.y1-b2/2+1e-6;y+=b2){
    for(var x=bb.x0+r/2;x<=bb.x1-r/2+1e-6;x+=r){
      var pt=[x,y];if(!pip(pt,poly)||!pip(pt,lim)||dEdge(pt,poly)<r/2*0.9)continue;
      var ok=true;near(h,plot.plants,x,y,1,function(q){if(Math.hypot(q.x-x,q.y-y)<needed(c,q.c)*0.95)ok=false});
      if(!ok)continue;
      if(plot.plants.length>=8000)return added;
      var np={id:uid(),c:c,x:Math.round(x*100)/100,y:Math.round(y*100)/100};plot.plants.push(np);
      var k=Math.floor(np.x)+":"+Math.floor(np.y);(h[k]=h[k]||[]).push(plot.plants.length-1);added++;
    }
  }
  return added;
}

function carenzaFor(prod,plot){
  var P=PRODUCTS[prod],cs=Object.keys(cropsIn(plot));
  if(!P||P.car==null)return {days:0,offLabel:[],unknown:true};
  if(typeof P.car==="number")return {days:P.car,offLabel:[]};
  var max=0,off=[],unk=false;cs.forEach(function(c){var v=P.car[c]!=null?P.car[c]:P.car._;if(v==null){if(P.custom||"_" in P.car)unk=true;else off.push(CROPS[c].n)}else max=Math.max(max,v)});
  return {days:max,offLabel:off,unknown:unk};
}
function nextDue(pl){
  if(pl.done.length>=pl.count)return null;
  if(!pl.done.length)return parse(pl.start);
  return addDays(parse(pl.done[pl.done.length-1]),pl.every);
}
function harvestBlock(plot){
  var t=today(),out=null;
  S.plans.forEach(function(pl){if(pl.plot!==plot.id||!pl.done.length)return;var last=parse(pl.done[pl.done.length-1]),c=carenzaFor(pl.prod,plot).days,end=addDays(last,c);if(end>t&&(!out||end>out.end))out={end:end,prod:pl.prod}});
  return out;
}
function copperYear(plot){
  var y=today().getFullYear(),kg=0;
  S.plans.forEach(function(pl){if(pl.plot===plot.id&&PRODUCTS[pl.prod].copper)pl.done.forEach(function(d){if(parse(d).getFullYear()===y){var real=window.QOInv&&window.QOInv.cuFor(pl,d,plot);kg+=(real!=null?real:(+pl.cu||0))}})});
  return kg;
}
function lastFor(plot,dis){
  var best=null;
  S.plans.forEach(function(pl){if(pl.plot!==plot.id||PRODUCTS[pl.prod].tgt.indexOf(dis)<0)return;pl.done.forEach(function(d){var x=parse(d);if(!best||x>best.d)best={d:x,pl:pl}})});
  return best;
}
function risks(){
  var w=S.weather,out=[];
  S.plots.forEach(function(plot){
    if(plot.vine&&plot.vine.phen&&plot.vine.phen.length){var lst=plot.vine.phen[plot.vine.phen.length-1].st;if(lst==="riposo"||lst==="cadu")return}
    var fams={};Object.keys(cropsIn(plot)).forEach(function(c){fams[CROPS[c].fam]=1});
    if(!Object.keys(fams).length)return;
    var open=plot.type==="campo"||plot.type==="vigna";
    Object.keys(DIS).forEach(function(k){
      var D=DIS[k];if(D.serraOnly&&open)return;
      if(!D.fam.some(function(f){return fams[f]}))return;
      var lvl=0,why="";
      if(k==="peronospora"){
        if(w.wet>=6&&w.t>=10&&w.t<=25){lvl=2;why=w.wet+" h di foglia bagnata a "+w.t+" °C"}
        else if(w.wet>=3&&w.t>=8&&w.t<=27){lvl=1;why=w.wet+" h di foglia bagnata"}
      }else if(k==="oidio"){
        if(w.t>=20&&w.t<=30&&w.rh>=70&&w.wet<2){lvl=2;why="caldo umido con foglie asciutte"}
        else if(w.t>=16&&w.t<=32&&w.rh>=55&&w.wet<3){lvl=1;why="temperature favorevoli"}
      }else if(k==="botrite"){
        if(w.rh>=90&&w.t>=12&&w.t<=24){lvl=2;why="umidità "+w.rh+"% in ambiente chiuso"}
        else if(w.rh>=80&&w.t>=10){lvl=1;why="umidità alta"}
      }
      if(!lvl)return;
      var last=lastFor(plot,k),prot=null,washed=false;
      if(last){var P=PRODUCTS[last.pl.prod],end=addDays(last.d,last.pl.every);
        var rs=window.QOMeteo?window.QOMeteo.rainSince(last.d):null;
        washed=open&&P.rainWash&&(rs!=null?rs>=20:(w.rain>=20&&diffDays(today(),last.d)>=2));if(washed&&rs!=null)w=Object.assign({},w,{rain:rs});
        if(end>=today()&&!washed)prot={until:end,prod:last.pl.prod}}
      var sug=Object.keys(PRODUCTS).filter(function(p){return PRODUCTS[p].tgt.indexOf(k)>=0});
      out.push({plot:plot,dis:k,lvl:lvl,why:why,prot:prot,washed:washed,sug:sug});
    });
  });
  return out.sort(function(a,b){return ((b.prot?0:1)-(a.prot?0:1))*10+(b.lvl-a.lvl)});
}

/* ---------- vista mappa: zoom e trascinamento condivisi ---------- */
var VIEWS={};
function fitView(key,b,margin){VIEWS[key]={x:b.x0-margin,y:b.y0-margin,w:(b.x1-b.x0)+margin*2,h:(b.y1-b.y0)+margin*2,aspect:0.68}}
function vbOf(key){var v=VIEWS[key],a=v.aspect||0.68,w=Math.max(v.w,v.h/a),h=w*a,cx=v.x+v.w/2,cy=v.y+v.h/2;return {x:cx-w/2,y:cy-h/2,w:w,h:h}}
function zoom(key,f){var v=vbOf(key),cx=v.x+v.w/2,cy=v.y+v.h/2;VIEWS[key]={x:cx-v.w*f/2,y:cy-v.h*f/2,w:v.w*f,h:v.h*f,aspect:v.h/v.w}}
function svgPt(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();if(!m)return [0,0];var r=p.matrixTransform(m.inverse());return [r.x,r.y]}
/* trascina per spostare, due dita (o rotella) per ingrandire; tocco singolo = azione */
function bindPan(svg,key,onTap){
  var P={},st=null,pz=null,redraw=null;
  function setV(v){VIEWS[key]=v;svg.setAttribute("viewBox",v.x+" "+v.y+" "+v.w+" "+v.h)}
  function later(){clearTimeout(redraw);redraw=setTimeout(function(){if(svg.isConnected&&!pts().length)render()},180)}
  function pts(){return Object.keys(P).map(function(k){return P[k]})}
  function zoomAt(v,f,cx,cy,r){var w=Math.max(2,Math.min(8000,v.w*f));f=w/v.w;var px=v.x+(cx-r.left)/r.width*v.w,py=v.y+(cy-r.top)/r.height*v.h;return {x:px-(px-v.x)*f,y:py-(py-v.y)*f,w:w,h:v.h*f,aspect:v.h/v.w}}
  svg.addEventListener("pointerdown",function(e){P[e.pointerId]={x:e.clientX,y:e.clientY};try{svg.setPointerCapture(e.pointerId)}catch(_){}
    var a=pts();
    if(a.length===1)st={x:e.clientX,y:e.clientY,v:vbOf(key),moved:false,t:e.target};
    else if(a.length===2){var r=svg.getBoundingClientRect();pz={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,v:vbOf(key),r:r};if(st)st.moved=true}});
  svg.addEventListener("pointermove",function(e){if(!P[e.pointerId])return;P[e.pointerId]={x:e.clientX,y:e.clientY};var a=pts();
    if(pz&&a.length>=2){var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,v=zoomAt(pz.v,pz.d/d,pz.mx,pz.my,pz.r),k=v.w/pz.r.width;v.x-=(mx-pz.mx)*k;v.y-=(my-pz.my)*k;setV(v);return}
    if(!st)return;var dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)<7)return;st.moved=true;var k2=st.v.w/(svg.getBoundingClientRect().width||svg.clientWidth);setV({x:st.v.x-dx*k2,y:st.v.y-dy*k2,w:st.v.w,h:st.v.h,aspect:st.v.h/st.v.w})});
  function up(e,cancel){var was=pts().length;delete P[e.pointerId];
    if(was===1&&st){if(!st.moved&&!cancel)onTap(svgPt(svg,e),{target:st.t});else if(st.moved)later();st=null;return}
    if(was>=2){pz=null;st=null;var a=pts();if(a.length===1)st={x:a[0].x,y:a[0].y,v:vbOf(key),moved:true,t:null};later()}
    if(!pts().length)st=null}
  svg.addEventListener("pointerup",function(e){up(e,false)});
  svg.addEventListener("pointercancel",function(e){up(e,true)});
  svg.addEventListener("wheel",function(e){e.preventDefault();setV(zoomAt(vbOf(key),e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY,svg.getBoundingClientRect()));later()},{passive:false});
}

function miniChart(pts,key,title,unit,color){
  if(pts.length<2)return '';
  var W=340,H=150,L=36,R=40,T=12,B=26,d0=parse(pts[0].date),span=Math.max(1,diffDays(parse(pts[pts.length-1].date),d0));
  var vals=pts.map(function(p){return p[key]}),mn=Math.floor(Math.min.apply(null,vals)-0.5),mx=Math.ceil(Math.max.apply(null,vals)+0.5);if(mx===mn)mx=mn+1;
  var X=function(p){return L+diffDays(parse(p.date),d0)/span*(W-L-R)},Y=function(v){return T+(mx-v)/(mx-mn)*(H-T-B)};
  var s='<figure style="margin:0"><figcaption class="small" style="font-weight:700;margin-bottom:4px">'+title+'</figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+title+' nel tempo" style="width:100%;height:auto;display:block">';
  var step=(mx-mn)>6?2:1;for(var v=mn;v<=mx;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Mono,monospace">'+v+'</text>';
  s+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p[key]).toFixed(1)}).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){var tip=fmt(parse(p.date))+': '+num(p[key],2)+' '+unit;s+='<circle cx="'+X(p)+'" cy="'+Y(p[key])+'" r="4" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/><circle cx="'+X(p)+'" cy="'+Y(p[key])+'" r="14" fill="transparent" data-act="tip" data-t="'+esc(tip)+'" style="cursor:pointer"><title>'+esc(tip)+'</title></circle>'});
  var lp=pts[pts.length-1];s+='<text x="'+(X(lp)+8)+'" y="'+(Y(lp[key])+4)+'" font-size="12" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">'+num(lp[key],1)+'</text>';
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--ink-2)">'+fmt(d0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--ink-2)">'+fmt(parse(lp.date))+'</text></svg></figure>';
  return s;
}

function vineChange(t){
  var id=t.id;if(!id)return false;
  if(id==="vwT"||id==="vwRain"||id==="vwShoot"){S.vw[{vwT:"t",vwRain:"rain",vwShoot:"shoot"}[id]]=parseFloat(t.value)||0;if(id!=="vwShoot"&&window.QOMeteo)window.QOMeteo.markManual();save();render();return true}
  if(id.indexOf("bp-")===0){S.botte.sel[id.slice(3)]=t.checked;save();render();return true}
  if(id==="bProd"){S.botte.prod=t.value;save();render();return true}
  if(id==="bDose"||id==="bWater"||id==="bTank"||id==="bTit"){S.botte[{bDose:"dose",bWater:"water",bTank:"tank",bTit:"tit"}[id]]=parseFloat(t.value)||0;save();render();return true}
  if(id==="bUnit"){S.botte.unit=t.value;save();render();return true}
  if(id==="vmSel"){UI.vmSel=t.value;render();return true}
  if(id==="vfOriAuto"||id==="vfNRows"){readVForm();render();return true}
  if(id==="vfMode"){readVForm();var f=UI.vedit;if(f.rmode==="man"&&!(f.mrows||[]).length){var pp=f.id&&plotById(f.id);if(pp){var gc=vineGeoCurve(pp,"curva");f.mrows=gc.rows.map(function(r){return {c:r.segs.length?r.segs[0].c:0,len:0}})}}render();return true}
  if(id==="vfFile"||id==="vfFile2"){
    var file=t.files&&t.files[0];if(!file)return true;readVForm();var form=UI.vedit;
    readFileAsText(file,function(txt){
      var polys;try{polys=parseGeoFile(txt,file.name)}catch(e){toast("File non leggibile: usa GPX, KML o GeoJSON");return}
      if(!polys.length){toast("Nel file non ho trovato un perimetro");return}
      if(id==="vfFile2"){var p=plotById(form.id),tmp=importPolys([polys[0]],form);if(tmp.length){p.pts=tmp[0].pts;S.plots=S.plots.filter(function(x){return x.id!==tmp[0].id});readVForm();VACT.vSave();delete VIEWS["vine-"+p.id];delete VIEWS.map;save();render();toast("Forma aggiornata: "+num(area(p.pts)/1e4,2)+" ha")}return}
      var made=importPolys(polys,form,form.ter||"");if(!made.length){toast("Perimetro troppo piccolo o non valido");return}
      if(made.length===1&&form.name&&!/^Parcella \d+$/.test(form.name))made[0].name=form.name;
      UI.vedit=null;UI.vsel=made[0].id;S.sel=made[0].id;delete VIEWS.map;save();render();
      toast(made.length===1?"Parcella importata: "+num(area(made[0].pts)/1e4,2)+" ha":made.length+" parcelle importate");
    });
    return true;
  }
  return false;
}

var LOCALKEY=KEY,pendingRender=false;
function safeRender(){
  var a=document.activeElement;
  if(a&&a.closest&&a.closest("#app")&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){
    if(!pendingRender){pendingRender=true;a.addEventListener("blur",function(){pendingRender=false;setTimeout(render,0)},{once:true})}
    return;
  }
  render();
}

    try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}else if(KEY===LOCALKEY){S=sample()}else{S={plots:[],plans:[],samples:[],vineInit:true}}}catch(e){S=KEY===LOCALKEY?sample():{plots:[],plans:[],samples:[],vineInit:true}}
    ["weather","cropSel","vw","botte"].forEach(function(f){if(S[f]==null&&prefs[f]!=null)S[f]=prefs[f]});
    if(!S.weather)S.weather={t:14,rh:70,wet:0,rain:0};if(!S.vw)S.vw={t:12,rain:0,shoot:0};if(!S.botte)S.botte={sel:{},prod:"rame",dose:3,unit:"kg",water:500,tank:1000,tit:20};if(!S.cropSel)S.cropSel="lattuga";if(!S.samples)S.samples=[];if(!S.inv)S.inv={items:[],moves:[]};

var ZLEVELS=[[0.8,"Molto piccolo"],[0.9,"Piccolo"],[1,"Normale"],[1.1,"Grande"],[1.2,"Molto grande"]],ZKEY="qo-zoom";
function getZoom(){try{var z=parseFloat(localStorage.getItem(ZKEY));return ZLEVELS.some(function(l){return l[0]===z})?z:1}catch(e){return 1}}
function applyZoom(z){var r=document.documentElement;if(window.CSS&&CSS.supports&&CSS.supports("zoom","1")){r.style.zoom=z===1?"":String(z);r.style.setProperty("--mapz",String(Math.round(1/z*10000)/10000))}else{r.style.fontSize=(z*100)+"%"}
  setTimeout(function(){window.dispatchEvent(new Event("resize"))},50)}
function zoomLevelsHtml(){var z=getZoom();return '<div class="zlv" role="group" aria-label="Dimensione">'+ZLEVELS.map(function(l,i){return '<button type="button" data-act="zoomSet" data-v="'+l[0]+'" aria-pressed="'+(l[0]===z)+'" aria-label="'+l[1]+'" style="font-size:'+(11+i*2.5)+'px">A</button>'}).join("")+'</div><div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>'+ZLEVELS.filter(function(l){return l[0]===z})[0][1]+' · '+Math.round(z*100)+'%</span><span>solo su questo dispositivo</span></div>'}
function micOn(){try{return localStorage.getItem("qo-mic")!=="0"}catch(e){return true}}
