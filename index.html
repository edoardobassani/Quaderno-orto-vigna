<style>
/* Layout: app a colonna singola (max 560px), barra di navigazione fissa in basso, una vista per scheda */
:root{
  --bg:#ECEFE4; --surface:#FFFFFF; --surface-2:#F5F7F0; --line:#D5DACB;
  --ink:#1A2119; --ink-2:#4E5A4F; --accent:#2E6A3C; --accent-ink:#FFFFFF;
  --serra:#3B6F87; --serra-fill:#D6E7EE; --campo-fill:#C9DDB5; --tunnel-fill:#E2DCF0; --tunnel:#5B4F86; --vigna-fill:#ECD9E2; --vigna:#7B2D4F;
  --soil:#8B6A47; --soil-2:#A88563; --warn:#A85F0A; --warn-bg:#FBEBD3; --bad:#B3261E; --bad-bg:#F9DEDC; --ok-bg:#DDEBD3;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A15; --surface:#1E2620; --surface-2:#252E27; --line:#36423A;
  --ink:#E7ECE3; --ink-2:#A9B5AA; --accent:#7CC08B; --accent-ink:#0F1A12;
  --serra:#8EC3DA; --serra-fill:#21404D; --campo-fill:#2C4527; --tunnel-fill:#352F4D; --tunnel:#B9AEE6; --vigna-fill:#45283A; --vigna:#E3A1C0;
  --soil:#5E4630; --soil-2:#76593D; --warn:#F2B35C; --warn-bg:#3D2C12; --bad:#F2918A; --bad-bg:#45201D; --ok-bg:#24381F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141A15; --surface:#1E2620; --surface-2:#252E27; --line:#36423A;
  --ink:#E7ECE3; --ink-2:#A9B5AA; --accent:#7CC08B; --accent-ink:#0F1A12;
  --serra:#8EC3DA; --serra-fill:#21404D; --campo-fill:#2C4527; --tunnel-fill:#352F4D; --tunnel:#B9AEE6; --vigna-fill:#45283A; --vigna:#E3A1C0;
  --soil:#5E4630; --soil-2:#76593D; --warn:#F2B35C; --warn-bg:#3D2C12; --bad:#F2918A; --bad-bg:#45201D; --ok-bg:#24381F; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;font-stretch:105%}
h3{font-size:16px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border-radius:14px;padding:14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--serra);outline-offset:2px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border:2px solid var(--ink)}
.dot{width:12px;height:12px;border-radius:6px;display:inline-block;flex-shrink:0}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--accent)}
.b-n{background:var(--surface-2);color:var(--ink-2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
input,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:16px var(--f-body);width:100%}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mapwrap{position:relative;background:var(--surface-2);border-radius:16px;overflow:hidden;touch-action:none;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px var(--f-body);cursor:pointer}
.hint{position:absolute;left:8px;bottom:8px;right:56px;font-size:13px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;border:1px solid transparent;cursor:pointer;color:var(--ink);text-align:left;font:inherit;width:100%}
.item[aria-current="true"]{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.swatch{width:36px;height:36px;border-radius:9px;flex-shrink:0;border:2px solid}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:6px;z-index:20}
.nav div{display:flex;max-width:560px;width:100%;justify-content:space-around}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:none;background:transparent;color:var(--ink-2);font:600 14px var(--f-body);border-radius:9px;white-space:nowrap;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tablebox{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;font-size:14px}
table.reg th,table.reg td{padding:6px 8px;text-align:left;white-space:nowrap;border-top:1px solid var(--line)}
table.reg th{border-top:0;color:var(--ink-2);font-weight:600;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:13px;color:var(--ink-2)}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);text-decoration:none;min-width:50px;padding:4px 0;border-radius:10px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:10px;background:var(--surface);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
.day b{font-family:var(--f-display);font-size:17px}
.day.today{background:var(--ink);color:var(--surface)}
.day i{width:7px;height:7px;border-radius:4px;background:transparent}
.risk{border-left:0;display:flex;gap:10px;align-items:flex-start}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar span.w{background:var(--warn)} .bar span.x{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
a{color:var(--serra)}
.src{font-size:13px}
.sep{height:1px;background:var(--line);margin:4px 0}
@media (prefers-reduced-motion:no-preference){.item,.btn,.chip{transition:background .15s,border-color .15s}}
</style>

</head>

function spacing(c){return CROPS[c].row/100}
function hashOf(plants){var h={};plants.forEach(function(p,i){var k=Math.floor(p.x)+":"+Math.floor(p.y);(h[k]=h[k]||[]).push(i)});return h}
function near(h,plants,x,y,r,fn){var cx=Math.floor(x),cy=Math.floor(y),R=Math.ceil(r);for(var i=cx-R;i<=cx+R;i++)for(var j=cy-R;j<=cy+R;j++){var b=h[i+":"+j];if(b)b.forEach(function(k){fn(plants[k],k)})}}
function needed(a,b){return (spacing(a)+spacing(b))/2}
function conflicts(plot){
  var P=plot.plants,h=hashOf(P),bad=new Set(),minD={};
  P.forEach(function(p,i){near(h,P,p.x,p.y,1,function(q,k){if(k<=i)return;var d=Math.hypot(p.x-q.x,p.y-q.y),n=needed(p.c,q.c)*0.9;if(d<n){bad.add(i);bad.add(k);minD[i]=d;minD[k]=d}})});
  return {bad:bad,minD:minD};
}
function fill(plot,c,limit){
  var cr=CROPS[c],r=cr.row/100,b2=cr.btw/100,poly=plot.pts,lim=limit||poly,bb=bbox(lim),added=0;
  var h=hashOf(plot.plants);
  for(var y=bb.y0+b2/2;y<=bb.y1-b2/2+1e-6;y+=b2){
    for(var x=bb.x0+r/2;x<=bb.x1-r/2+1e-6;x+=r){
      var pt=[x,y];if(!pip(pt,poly)||!pip(pt,lim)||dEdge(pt,poly)<r/2*0.9)continue;
      var ok=true;near(h,plot.plants,x,y,1,function(q){if(Math.hypot(q.x-x,q.y-y)<needed(c,q.c)*0.95)ok=false});
      if(!ok)continue;
      if(plot.plants.length>=8000)return added;
      var np={id:uid(),c:c,x:Math.round(x*100)/100,y:Math.round(y*100)/100};plot.plants.push(np);
      var k=Math.floor(np.x)+":"+Math.floor(np.y);(h[k]=h[k]||[]).push(plot.plants.length-1);added++;
    }
  }
  return added;
}

function carenzaFor(prod,plot){
  var P=PRODUCTS[prod],cs=Object.keys(cropsIn(plot));
  if(!P||P.car==null)return {days:0,offLabel:[],unknown:true};

  return {days:max,offLabel:off,unknown:unk};
}

function lastFor(plot,dis){
  var best=null;
  S.plans.forEach(function(pl){if(pl.plot!==plot.id||PRODUCTS[pl.prod].tgt.indexOf(dis)<0)return;pl.done.forEach(function(d){var x=parse(d);if(!best||x>best.d)best={d:x,pl:pl}})});
  return best;
}
function risks(){
  var w=S.weather,out=[];
  S.plots.forEach(function(plot){
    if(plot.vine&&plot.vine.phen&&plot.vine.phen.length){var lst=plot.vine.phen[plot.vine.phen.length-1].st;if(lst==="riposo"||lst==="cadu")return}
    var fams={};Object.keys(cropsIn(plot)).forEach(function(c){fams[CROPS[c].fam]=1});
    if(!Object.keys(fams).length)return;
    var open=plot.type==="campo"||plot.type==="vigna";
    Object.keys(DIS).forEach(function(k){
      var D=DIS[k];if(D.serraOnly&&open)return;
      if(!D.fam.some(function(f){return fams[f]}))return;
      var lvl=0,why="";
      if(k==="peronospora"){
        if(w.wet>=6&&w.t>=10&&w.t<=25){lvl=2;why=w.wet+" h di foglia bagnata a "+w.t+" °C"}
        else if(w.wet>=3&&w.t>=8&&w.t<=27){lvl=1;why=w.wet+" h di foglia bagnata"}
      }else if(k==="oidio"){
        if(w.t>=20&&w.t<=30&&w.rh>=70&&w.wet<2){lvl=2;why="caldo umido con foglie asciutte"}
        else if(w.t>=16&&w.t<=32&&w.rh>=55&&w.wet<3){lvl=1;why="temperature favorevoli"}
      }else if(k==="botrite"){
        if(w.rh>=90&&w.t>=12&&w.t<=24){lvl=2;why="umidità "+w.rh+"% in ambiente chiuso"}
        else if(w.rh>=80&&w.t>=10){lvl=1;why="umidità alta"}
      }
      if(!lvl)return;
      var last=lastFor(plot,k),prot=null,washed=false;
      if(last){var P=PRODUCTS[last.pl.prod],end=addDays(last.d,last.pl.every);
        var rs=window.QOMeteo?window.QOMeteo.rainSince(last.d):null;
        washed=open&&P.rainWash&&(rs!=null?rs>=20:(w.rain>=20&&diffDays(today(),last.d)>=2));if(washed&&rs!=null)w=Object.assign({},w,{rain:rs});
        if(end>=today()&&!washed)prot={until:end,prod:last.pl.prod}}
      var sug=Object.keys(PRODUCTS).filter(function(p){return PRODUCTS[p].tgt.indexOf(k)>=0});
      out.push({plot:plot,dis:k,lvl:lvl,why:why,prot:prot,washed:washed,sug:sug});
    });
  });
  return out.sort(function(a,b){return ((b.prot?0:1)-(a.prot?0:1))*10+(b.lvl-a.lvl)});
}

var VIEWS={};
function fitView(key,b,margin){VIEWS[key]={x:b.x0-margin,y:b.y0-margin,w:(b.x1-b.x0)+margin*2,h:(b.y1-b.y0)+margin*2,aspect:0.68}}
function vbOf(key){var v=VIEWS[key],a=v.aspect||0.68,w=Math.max(v.w,v.h/a),h=w*a,cx=v.x+v.w/2,cy=v.y+v.h/2;return {x:cx-w/2,y:cy-h/2,w:w,h:h}}
function zoom(key,f){var v=vbOf(key),cx=v.x+v.w/2,cy=v.y+v.h/2;VIEWS[key]={x:cx-v.w*f/2,y:cy-v.h*f/2,w:v.w*f,h:v.h*f,aspect:v.h/v.w}}
function svgPt(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();if(!m)return [0,0];var r=p.matrixTransform(m.inverse());return [r.x,r.y]}
function bindPan(svg,key,onTap){
  var st=null;
  svg.addEventListener("pointerdown",function(e){st={x:e.clientX,y:e.clientY,v:vbOf(key),moved:false,t:e.target};try{svg.setPointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener("pointermove",function(e){if(!st)return;var dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)<7)return;st.moved=true;var k=st.v.w/svg.clientWidth;VIEWS[key]={x:st.v.x-dx*k,y:st.v.y-dy*k,w:st.v.w,h:st.v.h,aspect:st.v.h/st.v.w};var v=VIEWS[key];svg.setAttribute("viewBox",v.x+" "+v.y+" "+v.w+" "+v.h)});
  svg.addEventListener("pointerup",function(e){if(st&&!st.moved)onTap(svgPt(svg,e),{target:st.t});st=null});
  svg.addEventListener("pointercancel",function(){st=null});
}

function drawImp(){
  var svg=$("#impsvg");if(!svg)return;var p=plotById(S.sel),key="imp-"+p.id,v=vbOf(key);
  svg.setAttribute("viewBox",v.x+" "+v.y+" "+v.w+" "+v.h);
  var pts=p.pts.map(function(q){return q.join(",")}).join(" "),g='';
  g+='<polygon points="'+pts+'" fill="var(--soil-2)" stroke="'+STROKE[p.type]+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/>';
  var step=v.w>40?5:1,bb=bbox(p.pts);
  for(var x=Math.ceil(bb.x0/step)*step;x<bb.x1;x+=step)g+='<line x1="'+x+'" y1="'+bb.y0+'" x2="'+x+'" y2="'+bb.y1+'" stroke="var(--soil)" vector-effect="non-scaling-stroke" pointer-events="none"/>';
  for(var y=Math.ceil(bb.y0/step)*step;y<bb.y1;y+=step)g+='<line x1="'+bb.x0+'" y1="'+y+'" x2="'+bb.x1+'" y2="'+y+'" stroke="var(--soil)" vector-effect="non-scaling-stroke" pointer-events="none"/>';
  var cf=conflicts(p),detail=v.w<25;
  p.plants.forEach(function(pl,i){
    if(pl.x<v.x-1||pl.x>v.x+v.w+1||pl.y<v.y-1||pl.y>v.y+v.h+1)return;
    var C=CROPS[pl.c],r=C.row/200,bad=cf.bad.has(i);
    if(detail||bad)g+='<circle cx="'+pl.x+'" cy="'+pl.y+'" r="'+r+'" fill="'+(bad?'var(--warn)':C.c)+'" fill-opacity="'+(bad?0.35:0.18)+'" stroke="'+(bad?'var(--warn)':'var(--surface)')+'" stroke-width="'+(bad?2.5:1)+'" '+(bad?'':'stroke-dasharray="3 2" ')+'vector-effect="non-scaling-stroke" pointer-events="none"/>';
    g+='<circle cx="'+pl.x+'" cy="'+pl.y+'" r="'+Math.max(r*0.45,v.w/260)+'" fill="'+C.c+'" pointer-events="none"/>';
  });
  var sb=step;g+='<g pointer-events="none"><rect x="'+(v.x+v.w*0.04)+'" y="'+(v.y+v.h*0.92)+'" width="'+sb+'" height="'+(v.h*0.012)+'" fill="var(--ink)"/><text x="'+(v.x+v.w*0.04)+'" y="'+(v.y+v.h*0.905)+'" font-size="'+v.w/30+'" font-family="IBM Plex Mono,monospace" fill="var(--ink)">'+sb+' m</text></g>';
  svg.innerHTML=g;
}
function impTap(pt){
  var p=plotById(S.sel);if(UI.mode==="sposta")return;
  if(UI.mode==="rimuovi"){var best=-1,bd=1e9;p.plants.forEach(function(pl,i){var d=Math.hypot(pl.x-pt[0],pl.y-pt[1]);if(d<bd){bd=d;best=i}});var v=vbOf("imp-"+p.id);if(best>=0&&bd<Math.max(0.3,v.w/25)){p.plants.splice(best,1);save();render()}return}
  if(!pip(pt,p.pts)){toast("Tocca dentro l'appezzamento");return}
  var c=S.cropSel,x=Math.round(pt[0]*20)/20,y=Math.round(pt[1]*20)/20,close=null;
  p.plants.forEach(function(q){var d=Math.hypot(q.x-x,q.y-y),n=needed(c,q.c);if(d<n*0.9&&(!close||d<close.d))close={d:d,n:n}});
  p.plants.push({id:uid(),c:c,x:x,y:y});save();render();
  if(close)toast("Troppo vicina: "+Math.round(close.d*100)+" cm, minimo "+Math.round(close.n*100)+" cm");
}

      else if(g.type==="MultiPolygon")g.coordinates.forEach(function(pg,k){push(nm+(g.coordinates.length>1?" ("+(k+1)+")":""),pg[0].map(rev))});

    for(var c=0;c<cs.length;c++)push((nmE?nmE.textContent.trim():base+" "+(i+1))+(cs.length>1?" ("+(c+1)+")":""),cs[c].textContent.trim().split(/\s+/).map(function(x){var a=x.split(",");return [parseFloat(a[1]),parseFloat(a[0])]}))}
  if(pms.length)return out;

  if(!groups.length){var w=doc.getElementsByTagName("wpt"),ll2=[];for(var q2=0;q2<w.length;q2++)ll2.push([parseFloat(w[q2].getAttribute("lat")),parseFloat(w[q2].getAttribute("lon"))]);push(base,ll2)}

}

function miniChart(pts,key,title,unit,color){
  if(pts.length<2)return '';
  var W=340,H=150,L=36,R=40,T=12,B=26,d0=parse(pts[0].date),span=Math.max(1,diffDays(parse(pts[pts.length-1].date),d0));
  var vals=pts.map(function(p){return p[key]}),mn=Math.floor(Math.min.apply(null,vals)-0.5),mx=Math.ceil(Math.max.apply(null,vals)+0.5);if(mx===mn)mx=mn+1;
  var X=function(p){return L+diffDays(parse(p.date),d0)/span*(W-L-R)},Y=function(v){return T+(mx-v)/(mx-mn)*(H-T-B)};
  var s='<figure style="margin:0"><figcaption class="small" style="font-weight:700;margin-bottom:4px">'+title+'</figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+title+' nel tempo" style="width:100%;height:auto;display:block">';
  var step=(mx-mn)>6?2:1;for(var v=mn;v<=mx;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Mono,monospace">'+v+'</text>';
  s+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p[key]).toFixed(1)}).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){var tip=fmt(parse(p.date))+': '+num(p[key],2)+' '+unit;s+='<circle cx="'+X(p)+'" cy="'+Y(p[key])+'" r="4" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/><circle cx="'+X(p)+'" cy="'+Y(p[key])+'" r="14" fill="transparent" data-act="tip" data-t="'+esc(tip)+'" style="cursor:pointer"><title>'+esc(tip)+'</title></circle>'});
  var lp=pts[pts.length-1];s+='<text x="'+(X(lp)+8)+'" y="'+(Y(lp[key])+4)+'" font-size="12" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">'+num(lp[key],1)+'</text>';
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--ink-2)">'+fmt(d0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--ink-2)">'+fmt(parse(lp.date))+'</text></svg></figure>';
  return s;
}

    var file=t.files&&t.files[0];if(!file)return true;readVForm();var form=UI.vedit;
    readFileAsText(file,function(txt){
      var polys;try{polys=parseGeoFile(txt,file.name)}catch(e){toast("File non leggibile: usa GPX, KML o GeoJSON");return}
      if(!polys.length){toast("Nel file non ho trovato un perimetro");return}
      if(id==="vfFile2"){var p=plotById(form.id),tmp=importPolys([polys[0]],form);if(tmp.length){p.pts=tmp[0].pts;S.plots=S.plots.filter(function(x){return x.id!==tmp[0].id});readVForm();VACT.vSave();delete VIEWS["vine-"+p.id];delete VIEWS.map;save();render();toast("Forma aggiornata: "+num(area(p.pts)/1e4,2)+" ha")}return}
      var made=importPolys(polys,form);if(!made.length){toast("Perimetro troppo piccolo o non valido");return}
      if(made.length===1&&form.name&&!/^Parcella \d+$/.test(form.name))made[0].name=form.name;
      UI.vedit=null;UI.vsel=made[0].id;S.sel=made[0].id;delete VIEWS.map;save();render();
      toast(made.length===1?"Parcella importata: "+num(area(made[0].pts)/1e4,2)+" ha":made.length+" parcelle importate");
    });
    return true;
  }
  return false;
}

document.addEventListener("change",function(e){
  var t=e.target;
  if(vineChange(t))return;

  else if(t.id==="pName"){plotById(S.sel).name=t.value.trim()||"Area";save();render()}
  else if(t.id==="pType"){var pp=plotById(S.sel);pp.type=t.value;if(t.value==="vigna"){if(!pp.vine)pp.vine=vineDefaults();pp.plants=[]}else delete pp.vine;save();render()}
  else if(t.id==="dName"){UI.draw.name=t.value}

/* ---------- ponte con la sincronizzazione cloud (js/sync.js) ---------- */
var LOCALKEY=KEY,pendingRender=false;
function safeRender(){
  var a=document.activeElement;
  if(a&&a.closest&&a.closest("#app")&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){
    if(!pendingRender){pendingRender=true;a.addEventListener("blur",function(){pendingRender=false;setTimeout(render,0)},{once:true})}
    return;
  }
  render();
}
window.QO={
  getState:function(){return S},
  /* passa a un archivio locale separato (es. cache dell'azienda) o torna a quello del dispositivo */
  useKey:function(k){KEY=k||LOCALKEY;VC={};VIEWS={};var prefs=S?{weather:S.weather,cropSel:S.cropSel,vw:S.vw,botte:S.botte}:{};
    try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}else if(KEY===LOCALKEY){S=sample()}else{S={plots:[],plans:[],samples:[],vineInit:true}}}catch(e){S=KEY===LOCALKEY?sample():{plots:[],plans:[],samples:[],vineInit:true}}
    ["weather","cropSel","vw","botte"].forEach(function(f){if(S[f]==null&&prefs[f]!=null)S[f]=prefs[f]});
    if(!S.weather)S.weather={t:14,rh:70,wet:0,rain:0};if(!S.vw)S.vw={t:12,rain:0,shoot:0};if(!S.botte)S.botte={sel:{},prod:"rame",dose:3,unit:"kg",water:500,tank:1000,tit:20};if(!S.cropSel)S.cropSel="lattuga";if(!S.samples)S.samples=[];if(!S.inv)S.inv={items:[],moves:[]};
    UI.vsel=null;UI.vedit=null;UI.planForm=null;UI.draw=null;render()},
  /* dati arrivati dal cloud: sostituiscono parcelle, piani, campioni e segni */
  applyRemote:function(d){if(d.customProducts)S.customProducts=d.customProducts;S.plots=d.plots;S.plans=d.plans;S.samples=d.samples;S.inv=d.inv||{items:[],moves:[]};if(d.meteo){var man=S.meteo&&S.meteo.manual;S.meteo=d.meteo;S.meteo.manual=!!man}S.geo=d.geo||S.geo||null;S.marksMeta=d.marksMeta||{};
    if(S.sel&&!plotById(S.sel))S.sel=S.plots[0]&&S.plots[0].id;if(!S.sel&&S.plots[0])S.sel=S.plots[0].id;S.vineInit=true;saveLocal();safeRender()},
  render:function(){safeRender()},
  saveLocal:function(){saveLocal()},
  toast:function(t){toast(t)},
  productName:function(k){return PRODUCTS[k]?PRODUCTS[k].n:k},
  products:function(){mergeCustom();return Object.keys(PRODUCTS).map(function(k){return {id:k,name:PRODUCTS[k].n,copper:!!PRODUCTS[k].copper}})},
  product:function(k){return PRODUCTS[k]},cropList:function(){return CROPS},
  uid:uid,iso:iso,today:today,parse:parse,addDays:addDays,esc:esc,eur:eur,carenzaFor:carenzaFor,nextDue:nextDue,
  isLocal:function(){return KEY===LOCALKEY},
  plotName:function(id){var p=plotById(id);return p?p.name:"appezzamento"},
  /* strumenti per la mappa satellitare (js/mappa.js) */
  ui:UI,save:function(){save()},plotById:plotById,vineGeo:vineGeo,ceppoXY:ceppoXY,vdot:vdot,pip:pip,area:area,bbox:bbox,num:num,m2:m2,fmt:fmt,
  typeName:TYPEN,stroke:STROKE,fill:FILL,
  setMark:function(plotId,key,state){var p=plotById(plotId);if(!p||!p.vine)return;if(state)p.vine.marks[key]=state;else delete p.vine.marks[key];save();render()}
};
